{% extends "base.html" %}
{% import "macros.html" as macros with context %}

{% block body %}
<title>{{ habit_.description }}</title>
<div class="text-center">
  <p class="font-custom">{{ habit_.description }}</p>
  <span class="badge-custom">{{ habit_.frequency }}</span>
  <p class="fst-italic text-muted mt-2">{{ habit_.date_created.strftime('%B %-d') }}</p>
</div>
{% endblock %}
