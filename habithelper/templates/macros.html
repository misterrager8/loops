{% macro item_card(item_, class='') %}
<div class="col-xl-3">
	<div class="p-2 mb-3 d-flex justify-content-between" style="border-left: 5px solid {{ item_.color }};">
		<span class=""><i class="bi bi-circle-fill me-2" style="color: {{ item_.color }}"></i>{{ item_.name }}</span>
		<span class="fst-italic text-muted small">from {{ item_.date_added.strftime('%-m-%-d-%y') }}</span>
		<div class="">
			<a class="me-1" onclick="toggleDiv('editItem' + {{ item_.id }})"><i class="bi bi-pen"></i></a>
			<a style="display: none;" id="deleteItem{{ item_.id }}" class="badge text-danger" href="{{ url_for('delete_item', id_=item_.id) }}">?</a>
			<a class="text-danger" onclick="toggleDiv('deleteItem' + {{ item_.id }})"><i class="bi bi-trash3"></i></a>
		</div>
	</div>
	<div id="editItem{{ item_.id }}" style="display: none;">{{ edit_item_form(item_) }}</div>
</div>
{% endmacro %}

{% macro add_item_form(class='') %}
<form method="POST" action="{{ url_for('add_item') }}" class="input-group {{ class }}">
	<input type="text" name="name" placeholder="Name" class="form-control" autocomplete="off">
	<button type="submit" class="btn btn-outline-success">Add Item</button>
</form>
{% endmacro %}

{% macro edit_item_form(item_, class='') %}
<form method="POST" action="{{ url_for('edit_item', id_=item_.id) }}" class="input-group {{ class }}">
	<input type="text" name="name" placeholder="Name" class="form-control" autocomplete="off" value="{{ item_.name }}">
	<button type="submit" class="btn btn-outline-secondary">Edit Item</button>
</form>
{% endmacro %}
